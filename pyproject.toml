[project]
name = "audio-search"
version = "0.1.0"
description = "HCSDLDPT BTL — trích đặc trưng giọng nói & nội dung cho bộ dữ liệu âm thanh"
readme = "README.md"
authors = [
    { name = "nviquang", email = "nguyenquang5010@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "speechbrain==1.0.3",
    "faster-whisper==1.2.1",
    "sentence-transformers==3.4.1",
    "transformers>=4.41,<5",
    "huggingface-hub>=0.20,<1.0",
    "librosa>=0.10,<0.12",
    "soundfile>=0.12",
    "numpy<2.3",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pandas>=2",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "tqdm",
    "requests>=2",
    "streamlit>=1.40",
]

[project.scripts]
audio-search = "audio_search.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.ruff.lint]
# BLE001: blind `except Exception` is intentional — batch pipeline isolates
#     per-file failures so one corrupt file doesn't abort the run.
# S110:   `try/except: pass` in tests is deliberate (skip malformed samples).
ignore = ["BLE001", "S110"]
# E402: allow imports after sys.path setup in scripts/ (download_models.py).
extend-select = ["E402"]
